<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP Wi-Fi Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="topnav">
    <h1>ESP Wi-Fi Manager</h1>
  </div>
  <div class="content">
    <div class="card-grid">
      <div class="card">
        <form action="/wifimanager" method="POST">
            <p style="line-height: .8;">
                <label for="ssid">Freezer Name</label><br>
                <input type="text" id="freezername" name="freezername" value="%FREEZER_NAME%" autofocus><br>
                <label for="ssid">SSID</label><br>
                <input type="text" id="ssid" name="ssid"><br>
                <label for="pass">Password</label><br>
                <input type="password" id="pass" name="pass"><br>
                <label for="ip">IP Address</label><br>
                <input type="text" id="ip" name="ip" value="%IP_ADDRESS%"><br>
                <label for="ip">Gateway Address</label><br>
                <input type="text" id="gateway" name="gateway" value="%GATEWAY_ADDRESS%"><br>
                <label for="emailSender">Email Sender Address</label><br>
                <input type="text" id="emailSender" name="emailSender"><br>
                <label for="emailSenderPass">Email Sender Password</label><br>
                <input type="password" id="emailSenderPass" name="emailSenderPass"><br>
                <label>Temperature Unit</label><br>

                <label>
                    <input type="radio" name="temp_unit" value="F" %TEMP_UNIT_F%>
                    Fahrenheit (&deg;F)
                </label>

                <label>
                    <input type="radio" name="temp_unit" value="C" %TEMP_UNIT_C%>
                    Celsius (&deg;C)
                </label><br>
                <label for="time_format">Time Format</label>
                <select name="time_format" id="time_format">
                    <br>
                    <option value="12" %TIME_FORMAT_12%>12-hour</option>
                    <option value="24" %TIME_FORMAT_24%>24-hour</option>
                </select><br>
                <label for="time_zone">Time Zone</label><br>
                <input type="text"
                       name="time_zone"
                       id="time_zone"
                       value="%TIME_ZONE%"
                       placeholder="CST6CDT,M3.2.0,M11.1.0"><br>

                <small>
                    Examples:<br>
                    Central: CST6CDT,M3.2.0,M11.1.0<br>
                    London: GMT0BST,M3.5.0/1,M10.5.0/2
                </small>
                <br><br>
                <input type="submit" value="Submit"><br><br>
                <button type="submit" name="reboot" value="true">Restart</button><br>

                <label>
                    <input type="checkbox" name="influx_enabled" value="true" %INFLUX_ENABLED%>
                    Enable InfluxDB
                </label><br>

                <label>InfluxDB Server IP</label><br>
                <input type="text" name="influx_server" value="%INFLUX_SERVER%" placeholder="192.168.1.50"><br>

                <label>InfluxDB Port</label><br>
                <input type="text" name="influx_port" value="%INFLUX_PORT%" placeholder="8086"><br>

                <label>InfluxDB Database</label><br>
                <input type="text" name="influx_database" value="%INFLUX_DATABASE%" placeholder="freezer"><br>

                <label>InfluxDB Username</label><br>
                <input type="text" name="influx_username" value="%INFLUX_USERNAME%"><br>

                <label>InfluxDB Password</label><br>
                <input type="password" name="influx_password" value="%INFLUX_PASSWORD%"><br>

                <label>InfluxDB Measurement Name</label><br>
                <input type="text" name="influx_measurement" value="%INFLUX_MEASUREMENT%" placeholder="freezertemp"><br>
                <button type="submit"
                        name="wipeall"
                        value="true"
                        onclick="return confirm('WARNING: This will erase ALL saved settings and restart the ESP32. Are you sure?');">
                    Wipe All Settings
                </button><br>
                <br><br>
            </p>
        </form></div>
        <hr>

                <h2>Firmware OTA Update</h2>

                <form action="/update" method="POST" enctype="multipart/form-data">
                    <input type="file" name="update" accept=".bin" required>
                    <br><br>
                    <button type="submit">Upload Firmware</button>
                </form>
        <hr>

                <h2>SPIFFS OTA Update</h2>

                <form action="/update-spiffs" method="POST" enctype="multipart/form-data">
                    <input type="file" name="update" accept=".bin" required>
                    <br><br>
                    <button type="submit">Upload SPIFFS</button>
                </form>
    </div>
  </div>
</body>
</html>
