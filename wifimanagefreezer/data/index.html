<!DOCTYPE HTML><html>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Freezer Alarm">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <style>
    html {
     font-family: Arial;
     display: inline-block;
     margin: 0px auto;
     text-align: center;
    }
    h2 { font-size: 3.0rem; }
    h3 { font-size: 1.2rem; }
    p { font-size: 3.0rem; }
    .units { font-size: 1.2rem; }
    .ds-labels{
      font-size: 1.5rem;
      vertical-align:middle;
      padding-bottom: 15px;
    }
  </style>
</head>
<body>
    <h2>%FREEZER_NAME%</h2>
    <p>
        <i class="fas fa-thermometer-half" style="color:#059e8a;"></i>
        <span class="ds-labels">Temperature %TEMP_UNIT%</span><br>
        <span id="temperature">%TEMPERATUREF%</span>
        <sup class="units">&deg;<span id="tempunit">%TEMP_UNIT%</span></sup>
    </p>
  <h2>ESP Email Notification</h2>
  <form action="/get">
    Email Address <input type="email" name="email_input" value="%EMAIL_INPUT%" required><br>
    @vtext.com for Verizon, @txt.att.net for AT&T<br>
    Secondary Email Address <input type="email" name="email_inputcc" value="%EMAIL_INPUTCC%"><br>
    Enable Email Notification <input type="checkbox" name="enable_email_input" value="true" %ENABLE_EMAIL%><br>
    Temperature Threshold <input type="number" step="0.1" name="threshold_input" value="%THRESHOLD%" required><br>
    <input type="submit" value="Submit">
  </form>
  <h3>Last received packet:<br><span id="timenow">%TIMESTAMP%<br/></span></h3>
  <div>
      <a href="/wifimanager">
          <button type="button">Setup</button>
      </a>
  </div>  
</body>
<script>
    function updateTemperature() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
            if (this.readyState == 4 && this.status == 200) {
                document.getElementById("temperature").innerHTML = this.responseText;
            }
        };

        var unit = "%TEMP_UNIT%";
        var endpoint = unit === "C" ? "/temperaturec" : "/temperaturef";

        xhttp.open("GET", endpoint, true);
        xhttp.send();
    }

    function updateTime() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function () {
            if (this.readyState == 4 && this.status == 200) {
                document.getElementById("timenow").innerHTML = this.responseText;
            }
        };
        xhttp.open("GET", "/timenow", true);
        xhttp.send();
    }

    // Update immediately when the page loads
    updateTemperature();
    updateTime();

    // Continue updating every 10 seconds
    setInterval(updateTemperature, 10000);
    setInterval(updateTime, 10000);
</script>
</html>
